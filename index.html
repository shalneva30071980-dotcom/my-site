<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёры для 4–5 класса</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .menu { max-width: 520px; width: 100%; text-align: center; }
  .menu h1 { color: #fff; font-size: 30px; margin-bottom: 6px; }
  .menu h1 span { color: #f5a623; }
  .menu .sub { color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 28px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 18px 22px; margin-bottom: 14px;
    text-decoration: none; transition: all 0.25s ease; text-align: left;
  }
  .card:hover {
    transform: translateY(-4px) scale(1.02);
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.2);
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
  }
  .card .icon {
    font-size: 36px; flex-shrink: 0; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 16px;
  }
  .card .text h2 { color: #fff; font-size: 17px; margin-bottom: 3px; }
  .card .text p { color: rgba(255,255,255,0.5); font-size: 12px; }
  .c1 .icon { background: rgba(239,68,68,0.15); }
  .c2 .icon { background: rgba(139,92,246,0.15); }
  .c3 .icon { background: rgba(245,166,35,0.15); }
  .c4 .icon { background: rgba(16,185,129,0.15); }
  .footer { color: rgba(255,255,255,0.25); font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="menu">
    <h1>📚 <span>Тренажёры</span></h1>
    <p class="sub">4–5 класс · выбери задание</p>

    <a class="card c1" href="https://shalneva30071980-dotcom.github.io/russian-sentence/">
      <div class="icon">📏</div>
      <div class="text">
        <h2>Разбери предложение</h2>
        <p>Подлежащее, сказуемое, дополнение</p>
      </div>
    </a>

    <a class="card c2" href="https://shalneva30071980-dotcom.github.io/parts-of-speech/">
      <div class="icon">🏷️</div>
      <div class="text">
        <h2>Части речи</h2>
        <p>Существительное, глагол, прилагательное</p>
      </div>
    </a>

    <a class="card c3" href="https://shalneva30071980-dotcom.github.io/memory-trainer/">
      <div class="icon">🧠</div>
      <div class="text">
        <h2>Тренажёр памяти</h2>
        <p>Найди пары: вопрос — ответ</p>
      </div>
    </a>

    <a class="card c4" href="https://shalneva30071980-dotcom.github.io/reading-trainer/">
      <div class="icon">📖</div>
      <div class="text">
        <h2>Смысловое чтение</h2>
        <p>Читаю — понимаю. 50 текстов</p>
      </div>
    </a>

    <div class="footer">✨ Удачи в учёбе!</div>
  </div>
</body>
</html>
