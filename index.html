<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Тренажёр памяти — 5 класс</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            padding: 15px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        body.theme-light {
            background: linear-gradient(135deg, #f0ebff, #ddd2f0, #c8b8e0);
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 25px;
            border-radius: 40px;
            background: rgba(20, 20, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        body.theme-light .container {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .header h1 {
            font-size: 24px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        body.theme-light .header h1 {
            color: #1a1a2e;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.6;
        }
        .header-right {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .badge {
            padding: 3px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .badge:hover {
            transform: scale(1.05);
        }
        .badge-level {
            background: linear-gradient(135deg, #f5a623, #d48c0e);
            color: white;
        }
        .badge-sound {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.theme-light .badge-sound {
            background: #e7def5;
            color: #1a1a2e;
            border-color: #dcccf0;
        }
        .badge-theme {
            background: rgba(255, 255, 255, 0.08);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body.theme-light .badge-theme {
            background: #e7def5;
            color: #1a1a2e;
            border-color: #dcccf0;
        }

        /* ===== ВЫБОР ПРЕДМЕТА ===== */
        .subject-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 10px 0 15px 0;
        }
        .subject-btn {
            padding: 8px 16px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .subject-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .subject-btn.active {
            border-color: #f5a623;
            background: rgba(245, 166, 35, 0.15);
            color: #f5a623;
            box-shadow: 0 0 20px rgba(245, 166, 35, 0.1);
        }
        body.theme-light .subject-btn {
            background: rgba(255, 255, 255, 0.6);
            color: #1a1a2e;
            border-color: rgba(215, 201, 238, 0.3);
        }
        body.theme-light .subject-btn.active {
            border-color: #4d2e7a;
            background: rgba(77, 46, 122, 0.1);
            color: #4d2e7a;
        }
        .subject-btn .icon {
            font-size: 18px;
        }
        .subject-btn .subj-name {
            font-size: 13px;
        }
        .subject-btn.all {
            border-color: #f5a623;
            background: rgba(245, 166, 35, 0.1);
            color: #f5a623;
        }
        body.theme-light .subject-btn.all {
            border-color: #4d2e7a;
            background: rgba(77, 46, 122, 0.08);
            color: #4d2e7a;
        }

        /* ===== СТАТИСТИКА ===== */
        .top-stats {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 50px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        body.theme-light .top-stats {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .top-stats span {
            padding: 2px 14px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }
        body.theme-light .top-stats span {
            background: white;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* ===== ТАЙМЕР ===== */
        .timer-display {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin: 5px 0;
            color: #f5a623;
        }
        body.theme-light .timer-display {
            color: #4d2e7a;
        }

        /* ===== СЕТКА ===== */
        .memory-grid {
            display: grid;
            gap: 10px;
            max-width: 550px;
            width: 100%;
            margin: 8px auto;
        }
        .grid-4x3 {
            grid-template-columns: repeat(4, 1fr);
        }
        .grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
        }
        .grid-4x6 {
            grid-template-columns: repeat(4, 1fr);
        }

        .memory-card {
            aspect-ratio: 1;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            user-select: none;
            min-height: 60px;
            padding: 8px;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            color: #fff;
            background: linear-gradient(135deg, #2a2a5a, #1a1a3e);
        }
        body.theme-light .memory-card {
            background: linear-gradient(135deg, #4d2e7a, #3b235b);
            color: #fff;
            border-color: rgba(215, 201, 238, 0.2);
        }

        .memory-card.flipped {
            background: #fff !important;
            border-color: #4d2e7a !important;
            color: #1a1a2e !important;
            transform: scale(1.02);
        }
        body.theme-light .memory-card.flipped {
            background: #fff !important;
            border-color: #4d2e7a !important;
            color: #1a1a2e !important;
        }

        .memory-card.matched {
            cursor: default;
            transform: scale(0.92);
            opacity: 0.4;
            background: rgba(100, 200, 100, 0.15) !important;
            border-color: rgba(100, 200, 100, 0.2) !important;
        }
        body.theme-light .memory-card.matched {
            background: #b9e6c6 !important;
            border-color: #1f8b4c !important;
            color: #0a3d22 !important;
        }

        .memory-card.disabled {
            pointer-events: none;
            opacity: 0.4;
        }

        /* ===== РУБАШКИ ПРЕДМЕТОВ ===== */
        .memory-card.subject-biology {
            background: linear-gradient(135deg, #1a4a2a, #2d5a3d);
        }
        .memory-card.subject-geography {
            background: linear-gradient(135deg, #1a3a5a, #2a5a7a);
        }
        .memory-card.subject-history {
            background: linear-gradient(135deg, #3a2a1a, #5a3a2a);
        }
        .memory-card.subject-capitals {
            background: linear-gradient(135deg, #2a1a4a, #4a2a6a);
        }
        .memory-card.subject-astronomy {
            background: linear-gradient(135deg, #0a0a3a, #1a1a5a);
        }
        .memory-card.subject-rulers {
            background: linear-gradient(135deg, #3a2a0a, #5a3a1a);
        }
        .memory-card.subject-literature {
            background: linear-gradient(135deg, #2a1a3a, #4a2a5a);
        }
        .memory-card.subject-ancient {
            background: linear-gradient(135deg, #3a1a1a, #5a2a2a);
        }
        .memory-card.subject-nature {
            background: linear-gradient(135deg, #1a3a3a, #2a5a5a);
        }

        .memory-card.flipped {
            background: #fff !important;
            border-color: #4d2e7a !important;
            color: #1a1a2e !important;
        }
        body.theme-light .memory-card.flipped {
            background: #fff !important;
            border-color: #4d2e7a !important;
            color: #1a1a2e !important;
        }

        /* ===== КНОПКИ ===== */
        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
            justify-content: center;
        }
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .btn:active {
            transform: translateY(2px) scale(0.97);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4d2e7a, #3b235b);
            color: white;
            box-shadow: 0 4px 16px rgba(77, 46, 122, 0.25);
        }
        .btn-success {
            background: linear-gradient(135deg, #2d7a4e, #1e5a38);
            color: white;
            box-shadow: 0 4px 16px rgba(45, 122, 78, 0.25);
        }
        .btn-gold {
            background: linear-gradient(135deg, #f5a623, #d48c0e);
            color: white;
            box-shadow: 0 4px 16px rgba(245, 166, 35, 0.25);
        }
        .btn-danger {
            background: linear-gradient(135deg, #e84393, #c2317a);
            color: white;
            box-shadow: 0 4px 16px rgba(232, 67, 147, 0.25);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        body.theme-light .btn-secondary {
            background: #e7def5;
            color: #1a1a2e;
            border-color: #dcccf0;
        }

        /* ===== ОБРАТНАЯ СВЯЗЬ ===== */
        .feedback {
            margin-top: 12px;
            padding: 14px 20px;
            border-radius: 40px;
            font-size: 16px;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.04);
            border-left: 5px solid #4d2e7a;
            color: #ccc;
        }
        body.theme-light .feedback {
            background: rgba(243, 237, 252, 0.8);
            color: #1f172e;
            border-left-color: #7558a8;
        }
        .feedback.success {
            border-left-color: #2d7a4e;
        }
        .feedback.error {
            border-left-color: #e84393;
        }
        .feedback.timer {
            border-left-color: #f5a623;
        }

        /* ===== ФУТЕР ===== */
        .footer {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 12px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            color: #666;
        }
        body.theme-light .footer {
            color: #6a5a7c;
            border-color: rgba(220, 207, 236, 0.3);
        }

        /* ===== МОДАЛКИ ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .modal {
            background: rgba(30, 30, 60, 0.98);
            border-radius: 40px;
            padding: 35px 40px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: modalPop 0.4s ease;
        }
        body.theme-light .modal {
            background: white;
            border: 1px solid rgba(215, 201, 238, 0.3);
        }
        @keyframes modalPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal .big-icon {
            font-size: 64px;
            display: block;
            margin: 10px 0;
        }
        .modal h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            color: #fff;
        }
        body.theme-light .modal h2 {
            color: #1a1a2e;
        }
        .modal h2.gold {
            color: #f5a623;
        }
        .modal h2.red {
            color: #e84393;
        }
        .modal h2.green {
            color: #2d7a4e;
        }
        .modal p {
            color: #ccc;
            margin: 8px 0 15px 0;
            line-height: 1.5;
        }
        body.theme-light .modal p {
            color: #35244f;
        }

        .modal .result-stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .modal .result-stats .stat-item {
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }
        body.theme-light .modal .result-stats .stat-item {
            background: rgba(243, 237, 252, 0.8);
            color: #1a1a2e;
        }
        .modal .result-stats .stat-item.green {
            background: rgba(185, 230, 198, 0.2);
            color: #6bcb77;
        }
        .modal .result-stats .stat-item.red {
            background: rgba(253, 217, 217, 0.2);
            color: #ff6b6b;
        }
        .modal .result-stats .stat-item.gold {
            background: rgba(245, 166, 35, 0.2);
            color: #f5a623;
        }

        .modal .certificate {
            border: 2px solid #f5a623;
            border-radius: 20px;
            padding: 18px;
            margin: 12px 0;
            background: rgba(245, 166, 35, 0.05);
        }
        body.theme-light .modal .certificate {
            background: linear-gradient(135deg, #fffdf5, #fff8e7);
        }
        .modal .certificate h3 {
            color: #f5a623;
            font-size: 20px;
            margin: 0 0 5px 0;
        }
        body.theme-light .modal .certificate h3 {
            color: #4d2e7a;
        }
        .modal .certificate .sub {
            color: #888;
            font-size: 13px;
        }
        body.theme-light .modal .certificate .sub {
            color: #6b558a;
        }

        .modal .modal-close-btn {
            margin-top: 15px;
            padding: 12px 40px;
            border-radius: 60px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .modal .modal-close-btn:hover {
            transform: scale(1.05);
        }
        .modal .modal-close-btn.gold {
            background: linear-gradient(135deg, #f5a623, #d48c0e);
            color: white;
        }
        .modal .modal-close-btn.green {
            background: linear-gradient(135deg, #2d7a4e, #1e5a38);
            color: white;
        }
        .modal .modal-close-btn.red {
            background: linear-gradient(135deg, #e84393, #c2317a);
            color: white;
        }

        /* ===== ФЕЙЕРВЕРК ===== */
        .firework-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
            animation: fireworkExplode 1.2s ease-out forwards;
        }
        @keyframes fireworkExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .achievement-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 22px;
            border-radius: 20px;
            background: linear-gradient(135deg, #f5a623, #d48c0e);
            color: white;
            font-weight: 700;
            font-size: 15px;
            z-index: 9999;
            animation: slideIn 0.5s ease, slideOut 0.5s ease 3s forwards;
            box-shadow: 0 8px 32px rgba(245, 166, 35, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            .memory-card {
                font-size: 12px;
                min-height: 50px;
                border-radius: 12px;
                padding: 5px;
            }
            .memory-grid {
                gap: 8px;
            }
            .header h1 {
                font-size: 20px;
            }
            .top-stats span {
                font-size: 11px;
                padding: 2px 10px;
            }
            .btn {
                font-size: 12px;
                padding: 8px 14px;
            }
            .subject-btn {
                font-size: 12px;
                padding: 6px 12px;
            }
            .subject-btn .subj-name {
                display: none;
            }
            .modal {
                padding: 25px 20px;
            }
            .grid-4x6 {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 400px) {
            .memory-card {
                font-size: 10px;
                min-height: 40px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <h1>
                🧠 Тренажёр памяти
                <small>5 класс</small>
            </h1>
            <div class="header-right">
                <span class="badge badge-level" id="levelBadge">⭐ Новичок</span>
                <span class="badge badge-sound" id="soundBtn">🔊 Звук</span>
                <span class="badge badge-theme" id="themeBtn">🎨 Тема</span>
            </div>
        </div>

        <!-- ===== ВЫБОР ПРЕДМЕТА ===== -->
        <div class="subject-selector" id="subjectSelector"></div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="top-stats">
            <span>📚 Предмет: <span id="currentSubject">Все</span></span>
            <span>🎯 Пар: <span id="pairs">0</span></span>
            <span>✅ Найдено: <span id="found">0</span></span>
            <span>❌ Ошибок: <span id="mistakes">0</span></span>
            <span>📊 Ходов: <span id="moves">0</span></span>
            <span>🏆 Побед: <span id="wins">0</span></span>
        </div>

        <!-- ===== ТАЙМЕР ===== -->
        <div class="timer-display" id="timerDisplay" style="display:none;">⏱ 01:00</div>

        <!-- ===== СЕТКА ===== -->
        <div class="memory-grid grid-4x4" id="memoryGrid"></div>

        <!-- ===== КНОПКИ ===== -->
        <div class="controls">
            <button class="btn btn-primary" id="newGameBtn">🔄 Новая игра</button>
            <button class="btn btn-secondary" id="easyBtn">😊 Лёгкий</button>
            <button class="btn btn-secondary" id="mediumBtn">🤔 Средний</button>
            <button class="btn btn-secondary" id="hardBtn">🔥 Сложный</button>
            <button class="btn btn-gold" id="modeToggleBtn">⏱ Режим</button>
        </div>

        <!-- ===== ОБРАТНАЯ СВЯЗЬ ===== -->
        <div class="feedback" id="feedback">
            💡 Выбери предмет и найди все пары «вопрос → ответ».
        </div>

        <!-- ===== ФУТЕР ===== -->
        <div class="footer">
            <span>🏆 <span id="totalGames">0</span> игр</span>
            <span>📊 <span id="winRate">0</span>% побед</span>
            <span>⭐ <span id="levelDisplay">Новичок</span></span>
        </div>
    </div>

    <!-- ===== МОДАЛКИ ===== -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal" id="resultContent"></div>
    </div>

    <script>
        // ============================================================
        //  ДАННЫЕ — 9 ПРЕДМЕТОВ ПО 5 КЛАССУ
        // ============================================================
        const SUBJECTS = {
            biology: {
                name: 'Биология',
                icon: '🌿',
                emoji: '🧬',
                color: '#2d5a3d',
                pairs: [
                    { q: 'Что выделяют растения в процессе фотосинтеза?', a: 'Кислород' },

        // ============================================================

        const Sound = {
            enabled: true,
            ctx: null,
            init() {
                try { this.ctx = new(window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
            },
            play(type) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    gain.gain.value = 0.08;
                    if (type === 'flip') {
                        osc.frequency.value = 600;
                        osc.type = 'sine';
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                        osc.start(this.ctx.currentTime);
                        osc.stop(this.ctx.currentTime + 0.08);
                    } else if (type === 'match') {
                        osc.frequency.value = 800;
                        osc.type = 'sine';
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                        osc.start(this.ctx.currentTime);
                        osc.stop(this.ctx.currentTime + 0.12);
                        setTimeout(() => {
                            const o2 = this.ctx.createOscillator();
                            const g2 = this.ctx.createGain();
                            o2.connect(g2);
                            g2.connect(this.ctx.destination);
                            g2.gain.value = 0.08;
                            o2.frequency.value = 1000;
                            o2.type = 'sine';
                            g2.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                            o2.start(this.ctx.currentTime);
                            o2.stop(this.ctx.currentTime + 0.08);
                        }, 120);
                    } else if (type === 'win') {
                        [523, 659, 784, 1047].forEach((freq, i) => {
                            setTimeout(() => {
                                const o = this.ctx.createOscillator();
                                const g = this.ctx.createGain();
                                o.connect(g);
                                g.connect(this.ctx.destination);
                                g.gain.value = 0.06;
                                o.frequency.value = freq;
                                o.type = 'sine';
                                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
                                o.start(this.ctx.currentTime);
                                o.stop(this.ctx.currentTime + 0.15);
                            }, i * 120);
                        });
                    } else if (type === 'bomb') {
                        osc.frequency.value = 200;
                        osc.type = 'sawtooth';
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                        osc.start(this.ctx.currentTime);
                        osc.stop(this.ctx.currentTime + 0.25);
                    }
                } catch (e) {}
            }
        };
        Sound.init();

        // ============================================================

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

            // ---- Рендер выбора предмета ----
            renderSubjectSelector() {
                let html = `
                    <button class="subject-btn all ${this.currentSubject === 'all' ? 'active' : ''}" data-subject="all">

                        <span class="subj-name">Все</span>
                    </button>
                `;
                SUBJECT_KEYS.forEach(key => {
                    const subj = SUBJECTS[key];
                    const active = this.currentSubject === key ? 'active' : '';
                    html += `

                        </button>
                    `;
                });
                this.subjectSelector.innerHTML = html;

                // События
                this.subjectSelector.querySelectorAll('.subject-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const subject = btn.dataset.subject;
                        this.currentSubject = subject;
                        this.saveSettings();
                        this.renderSubjectSelector();
                        this.startGame();
                        const name = subject === 'all' ? 'Все' : SUBJECTS[subject].name;

                    });
                });

                const name = this.currentSubject === 'all' ? 'Все' : SUBJECTS[this.currentSubject].name;
                this.currentSubjectSpan.textContent = name;
            },

            // ---- Настройки уровня ----
            getLevelConfig() {
                const configs = {
                    easy: { pairs: 6, time: 30, gridClass: 'grid-4x3' },
                    medium: { pairs: 8, time: 60, gridClass: 'grid-4x4' },
                    hard: { pairs: 10, time: 90, gridClass: 'grid-4x6' }
                };
                return configs[this.level] || configs.medium;
            },

            // ---- Генерация карточек ----
            generateCards() {
                const config = this.getLevelConfig();
                let pairsCount = config.pairs;

                // Собираем пары из выбранных предметов
                let allPairs = [];
                if (this.currentSubject === 'all') {
                    SUBJECT_KEYS.forEach(key => {
                        SUBJECTS[key].pairs.forEach(p => {
                            allPairs.push({ q: p.q, a: p.a, subject: key });
                        });
                    });
                } else {
                    SUBJECTS[this.currentSubject].pairs.forEach(p => {
                        allPairs.push({ q: p.q, a: p.a, subject: this.currentSubject });
                    });
                }

                // Перемешиваем и берём нужное количество
                const shuffled = shuffleArray([...allPairs]);
                const selected = shuffled.slice(0, pairsCount);

                // Создаём карточки: вопрос и ответ
                const deck = [];
                selected.forEach((item, idx) => {
                    deck.push({
                        id: idx,
                        display: item.q,
                        type: 'question',
                        pairId: idx,
                        subject: item.subject,
                        answer: item.a
                    });
                    deck.push({
                        id: idx,
                        display: item.a,
                        type: 'answer',
                        pairId: idx,
                        subject: item.subject,
                        question: item.q
                    });
                });

                return shuffleArray(deck);
            },

            // ---- Запуск игры ----
            startGame() {
                this.clearTimer();
                this.cards = this.generateCards();
                this.totalPairs = this.cards.length / 2;
                this.matchedPairs = 0;
                this.moves = 0;
                this.mistakes = 0;
                this.flippedCards = [];
                this.isLocked = false;
                this.isGameOver = false;

                const config = this.getLevelConfig();
                if (this.mode === 'time') {
                    this.maxTime = config.time;
                    this.timeLeft = this.maxTime;
                    this.isTimerRunning = true;
                    this.timerDisplay.style.display = 'block';
                    this.timerDisplay.textContent = `⏱ ${this.formatTime(this.timeLeft)}`;
                    this.timerDisplay.style.color = '#f5a623';
                    this.startTimer();
                } else {
                    this.timerDisplay.style.display = 'none';
                    this.isTimerRunning = false;
                }

                this.renderGrid();
                this.updateStatsUI();
                this.updateFeedback('💡 Найди все пары «вопрос → ответ». Нажимай на карточки.', '');
            },

            renderGrid() {
                const config = this.getLevelConfig();
                this.grid.className = `memory-grid ${config.gridClass}`;
                this.grid.innerHTML = '';

                this.cards.forEach((card, index) => {
                    const div = document.createElement('div');
                    div.className = 'memory-card';
                    if (card.flipped) div.classList.add('flipped');
                    if (card.matched) div.classList.add('matched');

                    // Своя рубашка для каждого предмета
                    if (card.subject) {
                        div.classList.add('subject-' + card.subject);
                    }

                    div.dataset.index = index;

                    if (card.flipped || card.matched) {
                        div.textContent = card.display;
                        div.style.color = '#1a1a2e';
                    } else {
                        // Рубашка — иконка предмета
                        const icon = card.subject ? SUBJECTS[card.subject]?.icon || '❓' : '❓';
                        div.textContent = icon;
                        div.style.fontSize = '28px';
                    }

                    div.addEventListener('click', () => this.onCardClick(index));
                    this.grid.appendChild(div);
                });
            },

            // ---- Клик по карточке ----
            onCardClick(index) {
                if (this.isLocked || this.isGameOver) return;
                if (this.mode === 'time' && this.timeLeft <= 0) return;

                const card = this.cards[index];
                if (card.flipped || card.matched) return;
                if (this.flippedCards.length >= 2) return;

                card.flipped = true;
                Sound.play('flip');
                this.renderGrid();
                this.flippedCards.push(index);

                if (this.flippedCards.length === 2) {
                    this.moves++;
                    this.movesSpan.textContent = this.moves;
                    this.checkMatch();
                }
            },

            // ---- Проверка совпадения ----
            checkMatch() {
                this.isLocked = true;
                const [idx1, idx2] = this.flippedCards;
                const card1 = this.cards[idx1];
                const card2 = this.cards[idx2];

                const isMatch = card1.pairId === card2.pairId && card1.type !== card2.type;

                if (isMatch) {
                    card1.matched = true;
                    card2.matched = true;
                    this.matchedPairs++;
                    this.foundSpan.textContent = this.matchedPairs;
                    this.flippedCards = [];
                    this.isLocked = false;
                    Sound.play('match');
                    this.updateFeedback('✅ Отлично! Пара найдена!', 'success');
                    this.renderGrid();

                    if (this.matchedPairs === this.totalPairs) {
                        this.winGame();
                    }
                } else {
                    this.mistakes++;
                    this.mistakesSpan.textContent = this.mistakes;
                    Sound.play('bomb');
                    this.updateFeedback('❌ Не совпало. Запоминай!', 'error');

                    setTimeout(() => {
                        card1.flipped = false;
                        card2.flipped = false;
                        this.flippedCards = [];
                        this.isLocked = false;
                        this.renderGrid();
                        this.updateFeedback('💡 Попробуй снова!', '');
                    }, 700);
                }
            },

            // ---- Победа ----
            winGame() {
                this.isGameOver = true;
                this.clearTimer();
                this.wins++;
                this.totalGames++;
                Sound.play('win');

                this.checkAchievements();
                this.saveStats();
                this.updateStatsUI();

                const percent = Math.round((this.matchedPairs / this.totalPairs) * 100);
                let title, icon, color, btnText;

                if (this.mistakes <= 1 && this.matchedPairs === this.totalPairs) {
                    title = '🧠 СУПЕРПАМЯТЬ!';
                    icon = '🏆';
                    color = 'gold';
                    btnText = '🎉 Ура!';
                    this.launchFireworks();
                } else if (this.mistakes <= 4) {
                    title = '📜 ДИПЛОМ ОБ ОКОНЧАНИИ';
                    icon = '🎓';
                    color = 'gold';
                    btnText = '📚 Отлично!';
                    this.launchFireworks();
                } else {
                    title = '📜 ГРАМОТА ЗА СТАРАНИЕ';
                    icon = '💪';
                    color = 'red';
                    btnText = '📖 Продолжай тренироваться!';
                }

                const subjectName = this.currentSubject === 'all' ? 'Все предметы' : SUBJECTS[this.currentSubject].name;

                this.resultContent.innerHTML = `
                    <div class="big-icon">${icon}</div>
                    <h2 class="${color}">${title}</h2>
                    <p>📚 ${subjectName}</p>
                    <div class="result-stats">
                        <div class="stat-item green">✅ Найдено: ${this.matchedPairs}/${this.totalPairs}</div>
                        <div class="stat-item red">❌ Ошибок: ${this.mistakes}</div>
                        <div class="stat-item">📊 Ходов: ${this.moves}</div>
                    </div>
                    <div class="certificate">
                        <h3>🏅 Сертификат 5 класса</h3>
                        <div class="sub">Найдено пар: ${this.matchedPairs}/${this.totalPairs} | Ошибок: ${this.mistakes}</div>
                    </div>
                    <button class="modal-close-btn ${color}" id="resultCloseBtn">${btnText}</button>
                `;

                this.resultModal.classList.add('active');
                document.getElementById('resultCloseBtn').addEventListener('click', () => {
                    this.resultModal.classList.remove('active');
                    this.startGame();
                });

                this.updateFeedback('🎉 Победа! Отличная работа!', 'success');
            },

            // ---- Таймер ----
            startTimer() {
                this.clearTimer();
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    this.timerDisplay.textContent = `⏱ ${this.formatTime(this.timeLeft)}`;
                    if (this.timeLeft <= 5) {
                        this.timerDisplay.style.color = '#ff4444';
                    }
                    if (this.timeLeft <= 0) {
                        this.clearTimer();
                        this.isGameOver = true;
                        this.totalGames++;
                        this.saveStats();
                        this.updateStatsUI();
                        this.updateFeedback('⏰ Время вышло! Попробуй снова.', 'error');

                        this.resultContent.innerHTML = `
                            <div class="big-icon">⏰</div>
                            <h2 class="red">ВРЕМЯ ВЫШЛО!</h2>
                            <p>Ты нашла ${this.matchedPairs} из ${this.totalPairs} пар.</p>
                            <div class="result-stats">
                                <div class="stat-item green">✅ Найдено: ${this.matchedPairs}/${this.totalPairs}</div>
                                <div class="stat-item red">❌ Ошибок: ${this.mistakes}</div>
                            </div>
                            <button class="modal-close-btn gold" id="resultCloseBtn">🔄 Попробовать снова</button>
                        `;
                        this.resultModal.classList.add('active');
                        document.getElementById('resultCloseBtn').addEventListener('click', () => {
                            this.resultModal.classList.remove('active');
                            this.startGame();
                        });
                    }
                }, 1000);
            },

            clearTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
                this.timerDisplay.style.color = '#f5a623';
            },

            formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            },

            // ---- Достижения ----
            checkAchievements() {
                const newAchievs = [];
                if (this.mistakes <= 1 && !this.achievements.includes('master')) {
                    newAchievs.push('🧠 Мастер памяти');
                    this.achievements.push('master');
                }
                if (this.matchedPairs === this.totalPairs && this.mistakes <= 3 && !this.achievements.includes('perfect')) {
                    newAchievs.push('⭐ Идеальная игра');
                    this.achievements.push('perfect');
                }
                if (this.wins >= 3 && !this.achievements.includes('winner3')) {
                    newAchievs.push('🏆 Победитель x3');
                    this.achievements.push('winner3');
                }
                if (this.wins >= 5 && !this.achievements.includes('winner5')) {
                    newAchievs.push('👑 Чемпион x5');
                    this.achievements.push('winner5');
                }
                if (this.currentSubject !== 'all' && !this.achievements.includes('learner')) {
                    newAchievs.push('📚 Ученик');
                    this.achievements.push('learner');
                }

                newAchievs.forEach(a => {
                    this.showAchievement(a);
                });

                if (newAchievs.length > 0) {
                    this.updateLevel();
                    this.saveStats();
                }
            },

            showAchievement(name) {
                const div = document.createElement('div');
                div.className = 'achievement-popup';
                div.textContent = '🏅 ' + name;
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 3500);
            },

            updateLevel() {
                const count = this.achievements.length;
                let level = '⭐ Новичок';
                if (count >= 6) level = '👑 Легенда';
                else if (count >= 5) level = '🧠 Гений';
                else if (count >= 4) level = '🌟 Мастер';
                else if (count >= 3) level = '📚 Знаток';
                else if (count >= 2) level = '📖 Ученик';
                this.levelBadge.textContent = level;
                this.levelDisplay.textContent = level;
            },

            // ---- Фейерверк ----
            launchFireworks() {
                const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bd6', '#ff9f43', '#00d2d3', '#f368e0'];
                for (let burst = 0; burst < 4; burst++) {
                    setTimeout(() => {
                        for (let i = 0; i < 60; i++) {
                            const particle = document.createElement('div');
                            particle.className = 'firework-particle';
                            const size = Math.random() * 10 + 4;
                            const angle = Math.random() * 2 * Math.PI;
                            const dist = Math.random() * 280 + 60;
                            particle.style.cssText = `
                                width: ${size}px;
                                height: ${size}px;
                                background: ${colors[Math.floor(Math.random() * colors.length)]};
                                left: ${window.innerWidth / 2 + (Math.random() - 0.5) * 60}px;
                                top: ${window.innerHeight / 2 + (Math.random() - 0.5) * 60}px;
                                --tx: ${Math.cos(angle) * dist}px;
                                --ty: ${Math.sin(angle) * dist - 80}px;
                            `;
                            document.body.appendChild(particle);
                            setTimeout(() => particle.remove(), 1300);
                        }
                    }, burst * 350);
                }
            },

            // ---- Обновление UI ----
            updateStatsUI() {
                this.pairsSpan.textContent = this.totalPairs;
                this.foundSpan.textContent = this.matchedPairs;
                this.mistakesSpan.textContent = this.mistakes;
                this.movesSpan.textContent = this.moves;
                this.winsSpan.textContent = this.wins;
                this.totalGamesSpan.textContent = this.totalGames;
                this.winRateSpan.textContent = this.totalGames > 0 ? Math.round((this.wins / this.totalGames) * 100) : 0;
                this.updateLevel();
            },

            updateFeedback(text, type) {
                this.feedback.textContent = text;
                this.feedback.className = 'feedback ' + (type || '');
            },

            // ---- События ----
            setupEventListeners() {
                document.getElementById('newGameBtn').addEventListener('click', () => this.startGame());

                document.getElementById('easyBtn').addEventListener('click', () => {
                    this.level = 'easy';
                    this.saveSettings();
                    this.startGame();
                });
                document.getElementById('mediumBtn').addEventListener('click', () => {
                    this.level = 'medium';
                    this.saveSettings();
                    this.startGame();
                });
                document.getElementById('hardBtn').addEventListener('click', () => {
                    this.level = 'hard';
                    this.saveSettings();
                    this.startGame();
                });

                document.getElementById('modeToggleBtn').addEventListener('click', () => {
                    this.mode = this.mode === 'classic' ? 'time' : 'classic';
                    this.modeToggleBtn.textContent = this.mode === 'classic' ? '⏱ Режим' : '🎯 Классика';
                    this.saveSettings();
                    this.startGame();
                    this.updateFeedback(this.mode === 'classic' ? '🎯 Классический режим' : '⏱ Режим на время', '');
                });

                document.getElementById('soundBtn').addEventListener('click', () => {
                    Sound.enabled = !Sound.enabled;
                    this.saveSettings();
                    this.applyTheme();
                    this.updateFeedback(Sound.enabled ? '🔊 Звук включён' : '🔇 Звук выключен', '');
                });

                document.getElementById('themeBtn').addEventListener('click', () => {
                    const themes = ['dark', 'light'];
                    this.theme = this.theme === 'dark' ? 'light' : 'dark';
                    this.applyTheme();
                    this.saveSettings();
                });
            }
        };

        // ============================================================
        //  ЗАПУСК
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
</body>
</html>
